default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: inventory_management_system_development
  username: postgres
  password: jayvee
  host: localhost
  port: 5432

test:
  <<: *default
  database: inventory_management_system_test
  username: postgres
  password: jayvee
  host: localhost
  port: 5432

production:
  primary: &primary_production
    <<: *default
    database: inventory_management_system_production
    username: inventory_management_system
    password: <%= ENV["INVENTORY_MANAGEMENT_SYSTEM_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: inventory_management_system_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: inventory_management_system_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: inventory_management_system_production_cable
    migrations_paths: db/cable_migrate